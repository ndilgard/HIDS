<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HIDS Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --ok: #22863a;
    --warn: #f0a500;
    --crit: #cb2431;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #57606a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
  }
  h1 { font-size: 1.4rem; margin: 0 0 1.5rem; }
  .banner {
    padding: 1rem 1.25rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
    font-weight: 600;
  }
  .banner.clear { border-color: var(--ok); color: var(--ok); }
  .banner.alerts { border-color: var(--crit); color: var(--crit); }
  .banner.liveness { font-size: 1.05rem; }
  .banner.liveness.ok { border-color: var(--ok); color: var(--ok); }
  .banner.liveness.down { border-color: var(--crit); color: var(--crit); background: rgba(203,36,49,0.08); }
  .banner.remote { display: flex; justify-content: space-between; align-items: center; font-weight: 400; }
  .banner.remote .label { font-weight: 600; }
  .banner.remote.up { border-color: var(--ok); }
  .banner.remote.up .label { color: var(--ok); }
  .banner.remote.grace, .banner.remote.down { border-color: var(--crit); }
  .banner.remote.grace .label, .banner.remote.down .label { color: var(--crit); }
  .banner.remote.unknown { border-color: var(--muted); }
  .banner.remote.unknown .label { color: var(--muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }
  .card .module { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .card .result { margin-top: 0.4rem; font-size: 0.95rem; }
  .card .ts { margin-top: 0.5rem; font-size: 0.75rem; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
  .sev-critical { color: var(--crit); font-weight: 600; }
  .sev-warning { color: var(--warn); font-weight: 600; }
  .sev-info { color: var(--muted); }
  .empty { color: var(--muted); padding: 1rem 0; }
  button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.3rem 0.6rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  .wl-form { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
  .wl-form input {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.25rem 0.5rem;
    font-size: 0.8rem;
  }
  .wl-form .wl-field { width: 90px; }
  .wl-form .wl-value { flex: 1; min-width: 140px; }
  .wl-form .wl-note { width: 140px; }
  h2 { margin-top: 2rem; }
  .bulk-actions { margin: 0.5rem 0; }
  .bulk-actions button:disabled { opacity: 0.5; cursor: default; }
  input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
  .filter-bar { display: flex; gap: 1.25rem; align-items: flex-end; flex-wrap: wrap; margin-top: 1rem; }
  .filter-bar label {
    display: flex; flex-direction: column; gap: 0.25rem;
    font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
  }
  .filter-bar select, .filter-bar input {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 0.35rem 0.5rem; font-size: 0.9rem;
    text-transform: none; letter-spacing: normal;
  }
  .filter-bar input { min-width: 220px; }
  .filter-hint { font-size: 0.75rem; color: var(--muted); align-self: center; }
</style>
</head>
<body>
  <h1>HIDS Dashboard</h1>
  <div id="liveness-banner" class="banner liveness ok">Loading…</div>
  <div id="banner" class="banner clear">Loading…</div>
  <div id="remote-banner" class="banner remote unknown" style="display:none"></div>
  <div id="status" class="grid"></div>
  <div class="filter-bar">
    <label>Module
      <select id="filter-module" onchange="applyFilters()">
        <option value="">All</option>
        <option value="network">network</option>
        <option value="fim">fim</option>
        <option value="process">process</option>
        <option value="auth">auth</option>
      </select>
    </label>
    <label>Severity
      <select id="filter-severity" onchange="applyFilters()">
        <option value="">All</option>
        <option value="critical">critical</option>
        <option value="warning">warning</option>
        <option value="info">info</option>
      </select>
    </label>
    <label>Search
      <input id="filter-search" type="text" placeholder="summary or detail…" oninput="applyFilters()" />
    </label>
    <span class="filter-hint">Applies to Recent Alerts &amp; Suppressed Events below</span>
  </div>
  <h2>Recent Alerts</h2>
  <div class="bulk-actions">
    <button id="bulk-whitelist-btn" onclick="bulkWhitelist()" disabled>Whitelist Selected (0)</button>
  </div>
  <div id="alerts"></div>
  <h2>Whitelist</h2>
  <div id="whitelist"></div>
  <h2>Suppressed Events</h2>
  <div class="bulk-actions">
    <button id="bulk-unwhitelist-btn" onclick="bulkUnwhitelist()" disabled>Unwhitelist Selected (0)</button>
  </div>
  <div id="suppressed"></div>

<script>
function formatDuration(ms) {
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m}m`;
  return `${Math.round(m / 60)}h ${m % 60}m`;
}

const WHITELISTABLE_MODULES = ['network', 'fim', 'process'];
let alertsById = new Map();
let suppressedById = new Map();
let selectedAlertIds = new Set();
let selectedSuppressedIds = new Set();

// Full, unfiltered data from the last poll — filtering re-renders from these instead of
// re-fetching, so typing in the search box doesn't hit the network on every keystroke.
let lastAlerts = [];
let lastSuppressed = [];
let lastWhitelistById = new Map();

function passesFilters(a) {
  const module = document.getElementById('filter-module').value;
  const severity = document.getElementById('filter-severity').value;
  const search = document.getElementById('filter-search').value.trim().toLowerCase();
  if (module && a.module !== module) return false;
  if (severity && a.severity !== severity) return false;
  if (search) {
    const haystack = `${a.summary} ${JSON.stringify(a.detail)}`.toLowerCase();
    if (!haystack.includes(search)) return false;
  }
  return true;
}

function applyFilters() {
  renderAlertsTable();
  renderSuppressedTable();
}

function toggleAlertSelect(id, checked) {
  if (checked) selectedAlertIds.add(id); else selectedAlertIds.delete(id);
  updateBulkButtons();
}

function toggleSuppressedSelect(id, checked) {
  if (checked) selectedSuppressedIds.add(id); else selectedSuppressedIds.delete(id);
  updateBulkButtons();
}

function updateBulkButtons() {
  const wlBtn = document.getElementById('bulk-whitelist-btn');
  wlBtn.disabled = selectedAlertIds.size === 0;
  wlBtn.textContent = `Whitelist Selected (${selectedAlertIds.size})`;

  const unwlBtn = document.getElementById('bulk-unwhitelist-btn');
  unwlBtn.disabled = selectedSuppressedIds.size === 0;
  unwlBtn.textContent = `Unwhitelist Selected (${selectedSuppressedIds.size})`;
}

async function bulkWhitelist() {
  const seen = new Set();
  const rules = [];
  for (const id of selectedAlertIds) {
    const a = alertsById.get(id);
    if (!a || !WHITELISTABLE_MODULES.includes(a.module)) continue;
    const field = defaultWhitelistField(a.module);
    const value = a.detail && a.detail[field] != null ? String(a.detail[field]) : null;
    if (!value) continue;
    const key = `${a.module}|${field}|${value}`;
    if (seen.has(key)) continue;
    seen.add(key);
    rules.push({ module: a.module, field, value });
  }
  await Promise.all(rules.map(r => fetch('/api/whitelist', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(r),
  })));
  selectedAlertIds.clear();
  refresh();
}

async function bulkUnwhitelist() {
  const ruleIds = new Set();
  for (const id of selectedSuppressedIds) {
    const a = suppressedById.get(id);
    if (a && a.whitelistRuleId) ruleIds.add(a.whitelistRuleId);
  }
  await Promise.all([...ruleIds].map(rid => fetch(`/api/whitelist/${rid}`, { method: 'DELETE' })));
  selectedSuppressedIds.clear();
  refresh();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function defaultWhitelistField(module) {
  return module === 'fim' ? 'path' : 'exePath';
}

function showWhitelistForm(alertId) {
  const a = alertsById.get(alertId);
  if (!a) return;
  const field = defaultWhitelistField(a.module);
  const value = a.detail && a.detail[field] != null ? String(a.detail[field]) : '';
  const cell = document.getElementById(`wl-row-${alertId}`);
  cell.innerHTML = `
    <div class="wl-form">
      <input class="wl-field" type="text" value="${escapeHtml(field)}" />
      <input class="wl-value" type="text" value="${escapeHtml(value)}" />
      <input class="wl-note" type="text" placeholder="note (optional)" />
      <button onclick="submitWhitelist('${alertId}')">Add</button>
      <button onclick="refresh()">Cancel</button>
    </div>
  `;
}

async function submitWhitelist(alertId) {
  const a = alertsById.get(alertId);
  const cell = document.getElementById(`wl-row-${alertId}`);
  const field = cell.querySelector('.wl-field').value.trim();
  const value = cell.querySelector('.wl-value').value.trim();
  const note = cell.querySelector('.wl-note').value.trim();
  if (!a || !field || !value) return;
  await fetch('/api/whitelist', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ module: a.module, field, value, note: note || undefined }),
  });
  refresh();
}

async function removeRule(id) {
  await fetch(`/api/whitelist/${id}`, { method: 'DELETE' });
  refresh();
}

async function refresh() {
  const [status, alerts, remote, liveness, whitelist, suppressed] = await Promise.all([
    fetch('/api/status').then(r => r.json()),
    fetch('/api/alerts?limit=50').then(r => r.json()),
    fetch('/api/heartbeat-remote').then(r => r.json()),
    fetch('/api/liveness').then(r => r.json()),
    fetch('/api/whitelist').then(r => r.json()),
    fetch('/api/alerts?suppressed=true&limit=100').then(r => r.json()),
  ]);
  alertsById = new Map(alerts.map(a => [a.id, a]));
  suppressedById = new Map(suppressed.map(a => [a.id, a]));
  const whitelistById = new Map(whitelist.map(r => [r.id, r]));
  lastAlerts = alerts;
  lastSuppressed = suppressed;
  lastWhitelistById = whitelistById;

  // Drop selections for rows that dropped out of the current page (whitelisted, aged out of the
  // limit, or the rule behind a suppressed row got removed by some other action) — otherwise the
  // bulk-action count would silently include rows no longer on screen.
  for (const id of selectedAlertIds) if (!alertsById.has(id)) selectedAlertIds.delete(id);
  for (const id of selectedSuppressedIds) if (!suppressedById.has(id)) selectedSuppressedIds.delete(id);

  const livenessBanner = document.getElementById('liveness-banner');
  if (liveness.likelyDown) {
    livenessBanner.className = 'banner liveness down';
    livenessBanner.textContent = liveness.aliveAsOf
      ? `⚠ HIDS daemon may be down — no scan activity in ${formatDuration(liveness.staleMs)} (this dashboard runs as a separate process and stays up regardless)`
      : '⚠ HIDS daemon may be down — no scan data recorded yet (this dashboard runs as a separate process and stays up regardless)';
  } else {
    livenessBanner.className = 'banner liveness ok';
    livenessBanner.textContent = `HIDS daemon running — last confirmed ${formatDuration(liveness.staleMs)} ago`;
  }

  const remoteBanner = document.getElementById('remote-banner');
  if (!remote.configured) {
    remoteBanner.style.display = 'none';
  } else {
    remoteBanner.style.display = 'flex';
    if (remote.error) {
      remoteBanner.className = 'banner remote unknown';
      remoteBanner.innerHTML = `<span class="label">Healthchecks.io: unavailable</span><span>${remote.error}</span>`;
    } else {
      const statusClass = remote.status === 'up' ? 'up' : (remote.status === 'grace' || remote.status === 'down') ? 'down' : 'unknown';
      const lastPing = remote.last_ping ? new Date(remote.last_ping).toLocaleString() : 'never';
      remoteBanner.className = `banner remote ${statusClass}`;
      remoteBanner.innerHTML = `<span class="label">Healthchecks.io: ${remote.status.toUpperCase()}</span><span>Last ping: ${lastPing}</span>`;
    }
  }

  const banner = document.getElementById('banner');
  const recentAlertCount = alerts.length;
  if (recentAlertCount === 0) {
    banner.className = 'banner clear';
    banner.textContent = 'Clear — no alerts recorded';
  } else {
    banner.className = 'banner alerts';
    banner.textContent = `${recentAlertCount} alert(s) on record`;
  }

  const statusDiv = document.getElementById('status');
  statusDiv.innerHTML = status.map(s => `
    <div class="card">
      <div class="module">${s.module}</div>
      <div class="result">${s.last_result}</div>
      <div class="ts">${new Date(s.last_scan_ts).toLocaleString()}</div>
    </div>
  `).join('') || '<div class="empty">No scans recorded yet.</div>';

  renderAlertsTable();

  const whitelistDiv = document.getElementById('whitelist');
  if (whitelist.length === 0) {
    whitelistDiv.innerHTML = '<div class="empty">No whitelist rules.</div>';
  } else {
    whitelistDiv.innerHTML = `
      <table>
        <thead><tr><th>Module</th><th>Field</th><th>Value</th><th>Note</th><th>Matches</th><th>Last matched</th><th></th></tr></thead>
        <tbody>
          ${whitelist.map(r => `
            <tr>
              <td>${r.module}</td>
              <td>${escapeHtml(r.field)}</td>
              <td>${escapeHtml(r.value)}</td>
              <td>${r.note ? escapeHtml(r.note) : ''}</td>
              <td>${r.matchCount}</td>
              <td>${r.lastMatchedAt ? new Date(r.lastMatchedAt).toLocaleString() : 'never'}</td>
              <td><button onclick="removeRule('${r.id}')">Remove</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  renderSuppressedTable();

  updateBulkButtons();
}

function renderAlertsTable() {
  const alertsDiv = document.getElementById('alerts');
  const rows = lastAlerts.filter(passesFilters);
  if (lastAlerts.length === 0) {
    alertsDiv.innerHTML = '<div class="empty">No alerts.</div>';
    return;
  }
  if (rows.length === 0) {
    alertsDiv.innerHTML = '<div class="empty">No alerts match the current filters.</div>';
    return;
  }
  alertsDiv.innerHTML = `
    <table>
      <thead><tr><th></th><th>Time</th><th>Module</th><th>Severity</th><th>Summary</th><th></th></tr></thead>
      <tbody>
        ${rows.map(a => `
          <tr>
            <td>${
              WHITELISTABLE_MODULES.includes(a.module)
                ? `<input type="checkbox" ${selectedAlertIds.has(a.id) ? 'checked' : ''} onchange="toggleAlertSelect('${a.id}', this.checked)" />`
                : ''
            }</td>
            <td>${new Date(a.ts).toLocaleString()}</td>
            <td>${a.module}</td>
            <td class="sev-${a.severity}">${a.severity}</td>
            <td>${a.summary}</td>
            <td id="wl-row-${a.id}">${
              WHITELISTABLE_MODULES.includes(a.module)
                ? `<button onclick="showWhitelistForm('${a.id}')">Whitelist</button>`
                : ''
            }</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderSuppressedTable() {
  const suppressedDiv = document.getElementById('suppressed');
  const rows = lastSuppressed.filter(passesFilters);
  if (lastSuppressed.length === 0) {
    suppressedDiv.innerHTML = '<div class="empty">No suppressed events.</div>';
    return;
  }
  if (rows.length === 0) {
    suppressedDiv.innerHTML = '<div class="empty">No suppressed events match the current filters.</div>';
    return;
  }
  suppressedDiv.innerHTML = `
    <table>
      <thead><tr><th></th><th>Time</th><th>Module</th><th>Severity</th><th>Summary</th><th>Matched rule</th><th></th></tr></thead>
      <tbody>
        ${rows.map(a => {
          const rule = lastWhitelistById.get(a.whitelistRuleId);
          const ruleLabel = rule ? `${escapeHtml(rule.field)} = ${escapeHtml(rule.value)}` : '(rule removed)';
          return `
            <tr>
              <td>${
                rule
                  ? `<input type="checkbox" ${selectedSuppressedIds.has(a.id) ? 'checked' : ''} onchange="toggleSuppressedSelect('${a.id}', this.checked)" />`
                  : ''
              }</td>
              <td>${new Date(a.ts).toLocaleString()}</td>
              <td>${a.module}</td>
              <td class="sev-${a.severity}">${a.severity}</td>
              <td>${a.summary}</td>
              <td>${ruleLabel}</td>
              <td>${
                rule
                  ? `<button onclick="removeRule('${rule.id}')">Unwhitelist</button>`
                  : ''
              }</td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
